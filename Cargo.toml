[package]
name = "stellereum-sdk"
version = "0.1.0"
edition = "2021"
readme = "SDK-README.md"
description = "Minimal canonical transaction-builder SDK for Stellereum (B2 closer)"
license = "MIT OR Apache-2.0"

[dependencies]
stellereum = { path = "../stellereum" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
bincode = "1.3"
ed25519-dalek = { version = "2", features = ["rand_core"] }
ureq = "2"

[dev-dependencies]
serde_json = "1"
